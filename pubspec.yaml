name: hr_mobile
description: "Vision HR - Xodimlar boshqaruv tizimi"
publish_to: 'none'

version: 1.0.2+7

environment:
  sdk: '>=3.2.0 <4.0.0' 

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.11.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  fluttertoast: ^8.2.8
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"
  # App Store ikonkasida shaffoflik bo'lishi mumkin emas — alfa kanal olib tashlanadi.
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon.png
